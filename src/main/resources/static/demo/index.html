<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GX 예약 데모</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a20;
      --border: #2a2a32;
      --text: #e8e8ed;
      --muted: #888;
      --accent: #00d4aa;
      --accent-hover: #00b894;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; margin: 0 0 24px; color: var(--accent); }
    h2 { font-size: 1.1rem; margin: 20px 0 12px; color: var(--muted); }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      max-width: 640px;
    }
    input, button, select {
      font-size: 1rem;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    input { width: 100%; margin-bottom: 10px; }
    select { width: 100%; margin-bottom: 10px; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-weight: 600;
      margin-right: 8px;
      margin-top: 4px;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--border); color: var(--text); }
    button.danger { background: var(--danger); color: #fff; }
    button.danger:hover { background: #e55; }
    .hidden { display: none; }
    .message { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
    .message.error { background: rgba(255,107,107,0.15); color: var(--danger); }
    .message.success { background: rgba(0,212,170,0.15); color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    li:last-child { border-bottom: none; }
    .session-name { font-weight: 600; }
    .session-meta { font-size: 0.85rem; color: var(--muted); }
    .user-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 8px;
      background: rgba(0,212,170,0.15);
      color: var(--accent);
    }
    .user-badge.instructor { background: rgba(255,200,0,0.15); color: #ffc800; }
    .user-badge.admin { background: rgba(255,107,107,0.15); color: var(--danger); }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-row input, .form-row select { flex: 1; min-width: 120px; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    .form-group { margin-bottom: 10px; flex: 1; min-width: 120px; }
    .membership-count {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <h1>GX 예약 데모</h1>

  <section id="mainSection" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <span id="userInfo" style="color: var(--muted);"></span>
        <span id="accountBadge" class="user-badge"></span>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <span style="color:var(--muted); font-size:0.9rem;">회원권 잔여:
          <span id="membershipCount" class="membership-count">-</span>회
        </span>
        <button id="btnGrant">회원권 10회 발급 (데모)</button>
        <button id="btnLogout" class="secondary">로그아웃</button>
      </div>
    </div>
  </section>

  <!-- 강사 전용: 강의 관리 -->
  <section id="classSection" class="hidden">
    <h2>강의 관리 (강사 전용)</h2>

    <div style="margin-bottom:16px;">
      <button id="btnShowClassForm" class="secondary">+ 새 강의 등록</button>
    </div>

    <div id="classForm" class="hidden" style="border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px;">
      <h2 id="classFormTitle" style="margin-top:0;">강의 등록</h2>
      <input type="hidden" id="editClassId">

      <div class="form-row">
        <div class="form-group" style="flex:2; min-width:200px;">
          <label>강의명</label>
          <input type="text" id="classSessionName" placeholder="예) 오전 요가">
        </div>
        <div class="form-group">
          <label>요일</label>
          <select id="classDayOfWeek">
            <option value="1">월요일</option>
            <option value="2">화요일</option>
            <option value="3">수요일</option>
            <option value="4">목요일</option>
            <option value="5">금요일</option>
            <option value="6">토요일</option>
            <option value="7">일요일</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>기간 시작일</label>
          <input type="date" id="classStartDate">
        </div>
        <div class="form-group">
          <label>기간 종료일</label>
          <input type="date" id="classEndDate">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>강의 시작 시각</label>
          <input type="time" id="classStartTime" value="09:00">
        </div>
        <div class="form-group">
          <label>강의 종료 시각</label>
          <input type="time" id="classEndTime" value="10:00">
        </div>
        <div class="form-group">
          <label>최대 정원</label>
          <input type="number" id="classMaxCapacity" value="15" min="1">
        </div>
      </div>

      <button id="btnSaveClass">저장</button>
      <button id="btnCancelClassForm" class="secondary">취소</button>
      <div id="classFormMessage" class="message hidden"></div>
    </div>

    <ul id="myClassList"></ul>
    <div id="classListMessage" class="message hidden"></div>
  </section>

  <section id="sessionsSection" class="hidden">
    <h2>예약 가능 세션</h2>
    <button id="btnRefreshSessions">새로고침</button>
    <ul id="sessionList"></ul>
    <div id="sessionsMessage" class="message hidden"></div>
  </section>

  <section id="reservationsSection" class="hidden">
    <h2>내 예약</h2>
    <ul id="reservationList"></ul>
    <div id="reservationsMessage" class="message hidden"></div>
  </section>

  <script>
    const API_BASE = '';
    let accessToken = localStorage.getItem('gx_access_token');
    let userId = localStorage.getItem('gx_user_id');
    let accountCode = localStorage.getItem('gx_account_code');

    function show(el, visible) { el.classList.toggle('hidden', !visible); }
    function msg(el, text, isError) {
      el.textContent = text;
      el.className = 'message ' + (isError ? 'error' : 'success');
      show(el, true);
    }
    function hideMsg(el) { show(el, false); }

    function headers() {
      const h = { 'Content-Type': 'application/json' };
      if (accessToken) h['Authorization'] = 'Bearer ' + accessToken;
      return h;
    }

    function setLoggedIn(token, id, code) {
      accessToken = token;
      userId = id;
      accountCode = code;
      const loggedIn = !!accessToken;
      show(document.getElementById('mainSection'), loggedIn);
      show(document.getElementById('sessionsSection'), loggedIn);
      show(document.getElementById('reservationsSection'), loggedIn);
      show(document.getElementById('classSection'), loggedIn && accountCode === 'INSTRUCTOR');

      if (loggedIn) {
        document.getElementById('userInfo').textContent = '로그인: ' + (localStorage.getItem('gx_name') || localStorage.getItem('gx_email') || userId);
        const badge = document.getElementById('accountBadge');
        if (accountCode === 'INSTRUCTOR') { badge.textContent = '강사'; badge.className = 'user-badge instructor'; }
        else if (accountCode === 'ADMIN') { badge.textContent = '관리자'; badge.className = 'user-badge admin'; }
        else { badge.textContent = '회원'; badge.className = 'user-badge'; }
        loadMembershipCount();
        loadSessions();
        loadReservations();
        if (accountCode === 'INSTRUCTOR') loadMyClasses();
      }
    }

    async function loadMembershipCount() {
      try {
        const res = await fetch(API_BASE + '/api/memberships/me', { headers: headers() });
        const data = await res.json();
        if (res.ok && Array.isArray(data)) {
          const total = data.filter(m => m.status === 'ACTIVE')
                            .reduce((sum, m) => sum + (m.remainingCount || 0), 0);
          document.getElementById('membershipCount').textContent = total;
        }
      } catch (e) { /* 무시 */ }
    }

    // ─── 강의 관리 ──────────────────────────────────────────────────────────────

    async function loadMyClasses() {
      const listEl = document.getElementById('myClassList');
      const msgEl = document.getElementById('classListMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/classes/mine', { headers: headers() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '조회 실패');
        listEl.innerHTML = data.length === 0
          ? '<li class="session-meta">등록된 강의가 없습니다.</li>'
          : data.map(c => `
              <li>
                <div>
                  <span class="session-name">${c.sessionName}</span>
                  <div class="session-meta">
                    ${c.dayOfWeekName}요일 ${c.startTime}~${c.endTime}
                    | ${c.startDate} ~ ${c.endDate}
                    | 정원 ${c.maxCapacity}명
                    | 세션 ${c.sessionCount}회
                  </div>
                </div>
                <button class="secondary btnEditClass" data-id="${c.gxClassInfoId}"
                  data-name="${c.sessionName}" data-dow="${c.dayOfWeek}"
                  data-start-date="${c.startDate}" data-end-date="${c.endDate}"
                  data-start-time="${c.startTime}" data-end-time="${c.endTime}"
                  data-capacity="${c.maxCapacity}">수정</button>
              </li>`).join('');
        listEl.querySelectorAll('.btnEditClass').forEach(btn => {
          btn.onclick = () => openEditForm(btn.dataset);
        });
        hideMsg(msgEl);
      } catch (e) {
        msg(msgEl, e.message || '강의 목록 조회 실패', true);
      }
    }

    function openEditForm(data) {
      document.getElementById('classFormTitle').textContent = '강의 수정';
      document.getElementById('editClassId').value = data.id;
      document.getElementById('classSessionName').value = data.name;
      document.getElementById('classDayOfWeek').value = data.dow;
      document.getElementById('classStartDate').value = data.startDate;
      document.getElementById('classEndDate').value = data.endDate;
      document.getElementById('classStartTime').value = data.startTime;
      document.getElementById('classEndTime').value = data.endTime;
      document.getElementById('classMaxCapacity').value = data.capacity;
      show(document.getElementById('classForm'), true);
    }

    document.getElementById('btnShowClassForm').onclick = () => {
      document.getElementById('classFormTitle').textContent = '강의 등록';
      document.getElementById('editClassId').value = '';
      document.getElementById('classSessionName').value = '';
      document.getElementById('classStartDate').value = '';
      document.getElementById('classEndDate').value = '';
      document.getElementById('classStartTime').value = '09:00';
      document.getElementById('classEndTime').value = '10:00';
      document.getElementById('classMaxCapacity').value = '15';
      hideMsg(document.getElementById('classFormMessage'));
      show(document.getElementById('classForm'), true);
    };

    document.getElementById('btnCancelClassForm').onclick = () => {
      show(document.getElementById('classForm'), false);
    };

    document.getElementById('btnSaveClass').onclick = async () => {
      const formMsg = document.getElementById('classFormMessage');
      const classId = document.getElementById('editClassId').value;
      const body = {
        sessionName: document.getElementById('classSessionName').value.trim(),
        startDate: document.getElementById('classStartDate').value,
        endDate: document.getElementById('classEndDate').value,
        startTime: document.getElementById('classStartTime').value,
        endTime: document.getElementById('classEndTime').value,
        dayOfWeek: parseInt(document.getElementById('classDayOfWeek').value),
        maxCapacity: parseInt(document.getElementById('classMaxCapacity').value) || 15,
        requiredMembershipCount: 1
      };
      if (!body.sessionName || !body.startDate || !body.endDate) {
        msg(formMsg, '강의명, 기간을 입력하세요.', true);
        return;
      }
      try {
        const url = classId ? `${API_BASE}/api/gx/classes/${classId}` : `${API_BASE}/api/gx/classes`;
        const method = classId ? 'PUT' : 'POST';
        const res = await fetch(url, { method, headers: headers(), body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) { msg(formMsg, data.message || '저장 실패', true); return; }
        msg(formMsg, classId ? '강의가 수정되었습니다.' : `강의가 등록되었습니다. (${data.sessionCount}개 세션 생성)`, false);
        setTimeout(() => { show(document.getElementById('classForm'), false); loadMyClasses(); loadSessions(); }, 800);
      } catch (e) {
        msg(formMsg, '네트워크 오류', true);
      }
    };

    // ─── 세션 예약 ──────────────────────────────────────────────────────────────

    async function loadSessions() {
      const listEl = document.getElementById('sessionList');
      const msgEl = document.getElementById('sessionsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/sessions/upcoming', { headers: headers() });
        const sessions = await res.json();
        if (!res.ok) throw new Error(sessions.message || '조회 실패');
        listEl.innerHTML = sessions.length === 0
          ? '<li class="session-meta">예약 가능한 세션이 없습니다.</li>'
          : sessions.map(s => {
              const start = s.sessionStartAt ? new Date(s.sessionStartAt).toLocaleString('ko-KR') : '-';
              const isMyClass = accountCode === 'INSTRUCTOR' && s.instructorUserId === userId;
              const btnAttr = isMyClass ? 'disabled title="본인 강의는 예약할 수 없습니다."' : `data-session-id="${s.gxSessionId}" class="btnReserve"`;
              return `<li>
                <div>
                  <span class="session-name">${s.sessionName || 'GX'}</span>
                  <div class="session-meta">${start} | ${s.reservedCount ?? 0}/${s.maxCapacity ?? 0}명</div>
                </div>
                <button ${btnAttr} style="${isMyClass ? 'opacity:0.4;cursor:not-allowed;' : ''}">예약</button>
              </li>`;
            }).join('');
        listEl.querySelectorAll('.btnReserve').forEach(btn => {
          btn.onclick = () => reserve(btn.dataset.sessionId);
        });
        hideMsg(msgEl);
      } catch (e) {
        msg(msgEl, e.message || '세션 목록 조회 실패', true);
      }
    }

    async function reserve(gxSessionId) {
      const msgEl = document.getElementById('sessionsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/reservations', {
          method: 'POST', headers: headers(), body: JSON.stringify({ gxSessionId })
        });
        const data = await res.json();
        if (!res.ok) { msg(msgEl, data.message || '예약 실패', true); return; }
        msg(msgEl, '예약되었습니다.', false);
        loadMembershipCount();
        loadSessions();
        loadReservations();
      } catch (e) {
        msg(msgEl, e.message || '예약 실패', true);
      }
    }

    // ─── 내 예약 ────────────────────────────────────────────────────────────────

    async function loadReservations() {
      const listEl = document.getElementById('reservationList');
      const msgEl = document.getElementById('reservationsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/reservations', { headers: headers() });
        const reservations = await res.json();
        if (!res.ok) throw new Error(reservations.message || '조회 실패');
        const active = reservations.filter(r => r.status === 'RESERVED');
        listEl.innerHTML = active.length === 0
          ? '<li class="session-meta">예약 내역이 없습니다.</li>'
          : active.map(r => {
              const dateStr = r.sessionStartAt
                ? new Date(r.sessionStartAt).toLocaleString('ko-KR') : '-';
              const name = r.sessionName || ('세션 ' + r.gxSessionId.substring(0, 8));
              return `<li>
                <div>
                  <span class="session-name">${name}</span>
                  <div class="session-meta">${dateStr} | ${r.deductCount || 1}회 차감</div>
                </div>
                <button data-reservation-id="${r.reservationId}" class="btnCancel danger">취소</button>
              </li>`;
            }).join('');
        listEl.querySelectorAll('.btnCancel').forEach(btn => {
          btn.onclick = () => cancelReservation(btn.dataset.reservationId);
        });
        hideMsg(msgEl);
      } catch (e) {
        msg(msgEl, e.message || '예약 목록 조회 실패', true);
      }
    }

    async function cancelReservation(reservationId) {
      const msgEl = document.getElementById('reservationsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/reservations/' + reservationId + '/cancel', {
          method: 'POST', headers: headers()
        });
        if (!res.ok) {
          const data = await res.json();
          msg(msgEl, data.message || '취소 실패', true);
          return;
        }
        msg(msgEl, '예약이 취소되었습니다.', false);
        loadMembershipCount();
        loadSessions();
        loadReservations();
      } catch (e) {
        msg(msgEl, e.message || '취소 실패', true);
      }
    }

    // ─── 이벤트 바인딩 ────────────────────────────────────────────────────────

    document.getElementById('btnLogout').onclick = () => {
      localStorage.removeItem('gx_access_token');
      localStorage.removeItem('gx_user_id');
      localStorage.removeItem('gx_account_code');
      localStorage.removeItem('gx_email');
      localStorage.removeItem('gx_name');
      location.href = '/demo/login.html';
    };

    document.getElementById('btnGrant').onclick = async () => {
      try {
        const res = await fetch(API_BASE + '/api/demo/grant-membership?count=10&validDays=30', {
          method: 'POST', headers: headers()
        });
        const data = await res.json();
        if (!res.ok) { alert(data.message || '발급 실패'); return; }
        alert('회원권 10회 발급되었습니다. (유효기간 30일)');
        loadMembershipCount();
      } catch (e) { alert('네트워크 오류'); }
    };

    document.getElementById('btnRefreshSessions').onclick = loadSessions;

    // ─── 초기화 ────────────────────────────────────────────────────────────────

    if (!accessToken) {
      location.href = '/demo/login.html';
    } else {
      setLoggedIn(accessToken, userId, accountCode);
    }
  </script>
</body>
</html>
