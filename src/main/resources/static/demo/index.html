<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GX 예약 데모</title>
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #1a1a20;
      --border: #2a2a32;
      --text: #e8e8ed;
      --muted: #888;
      --accent: #00d4aa;
      --accent-hover: #00b894;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; margin: 0 0 24px; color: var(--accent); }
    h2 { font-size: 1.1rem; margin: 20px 0 12px; color: var(--muted); }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      max-width: 640px;
    }
    input, button {
      font-size: 1rem;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    input { width: 100%; margin-bottom: 10px; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-weight: 600;
      margin-right: 8px;
      margin-top: 4px;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--border); color: var(--text); }
    button.danger { background: var(--danger); color: #fff; }
    .auth-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .auth-row input { width: 180px; margin-bottom: 0; }
    .hidden { display: none; }
    .message { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
    .message.error { background: rgba(255,107,107,0.15); color: var(--danger); }
    .message.success { background: rgba(0,212,170,0.15); color: var(--accent); }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    li:last-child { border-bottom: none; }
    .session-name { font-weight: 600; }
    .session-meta { font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <h1>GX 예약 데모</h1>

  <section id="authSection">
    <h2>로그인 / 회원가입</h2>
    <div class="auth-row">
      <div>
        <label>이메일</label>
        <input type="email" id="email" placeholder="email@example.com">
      </div>
      <div>
        <label>비밀번호</label>
        <input type="password" id="password" placeholder="8자 이상">
      </div>
      <button id="btnLogin">로그인</button>
      <button id="btnRegister" class="secondary">회원가입</button>
    </div>
    <div id="authMessage" class="message hidden"></div>
  </section>

  <section id="mainSection" class="hidden">
    <p id="userInfo" style="color: var(--muted); margin-bottom: 16px;"></p>
    <button id="btnGrant">회원권 10회 발급 (데모)</button>
    <button id="btnLogout" class="secondary">로그아웃</button>
  </section>

  <section id="sessionsSection" class="hidden">
    <h2>예약 가능 세션</h2>
    <button id="btnRefreshSessions">새로고침</button>
    <ul id="sessionList"></ul>
    <div id="sessionsMessage" class="message hidden"></div>
  </section>

  <section id="reservationsSection" class="hidden">
    <h2>내 예약</h2>
    <ul id="reservationList"></ul>
    <div id="reservationsMessage" class="message hidden"></div>
  </section>

  <script>
    const API_BASE = '';
    let accessToken = localStorage.getItem('gx_access_token');
    let userId = localStorage.getItem('gx_user_id');

    function show(el, show) {
      el.classList.toggle('hidden', !show);
    }
    function msg(el, text, isError) {
      el.textContent = text;
      el.className = 'message ' + (isError ? 'error' : 'success');
      show(el, true);
    }
    function hideMsg(el) {
      show(el, false);
    }

    function headers() {
      const h = { 'Content-Type': 'application/json' };
      if (accessToken) h['Authorization'] = 'Bearer ' + accessToken;
      return h;
    }

    function setLoggedIn(token, id, email) {
      accessToken = token;
      userId = id;
      if (token) localStorage.setItem('gx_access_token', token);
      if (id) localStorage.setItem('gx_user_id', id);
      show(document.getElementById('authSection'), !accessToken);
      show(document.getElementById('mainSection'), !!accessToken);
      show(document.getElementById('sessionsSection'), !!accessToken);
      show(document.getElementById('reservationsSection'), !!accessToken);
      if (accessToken) {
        document.getElementById('userInfo').textContent = '로그인: ' + (email || userId);
        loadSessions();
        loadReservations();
      }
    }

    document.getElementById('btnLogin').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const authMsg = document.getElementById('authMessage');
      if (!email || !password) {
        msg(authMsg, '이메일과 비밀번호를 입력하세요.', true);
        return;
      }
      try {
        const res = await fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) {
          msg(authMsg, data.message || '로그인 실패', true);
          return;
        }
        setLoggedIn(data.accessToken, data.userId, data.email);
        msg(authMsg, '로그인되었습니다.', false);
      } catch (e) {
        msg(authMsg, '네트워크 오류', true);
      }
    };

    document.getElementById('btnRegister').onclick = async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const authMsg = document.getElementById('authMessage');
      if (!email || !password) {
        msg(authMsg, '이메일과 비밀번호를 입력하세요.', true);
        return;
      }
      if (password.length < 8) {
        msg(authMsg, '비밀번호는 8자 이상이어야 합니다.', true);
        return;
      }
      try {
        const res = await fetch(API_BASE + '/api/auth/register', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ email, password, name: null, phone: null })
        });
        const data = await res.json();
        if (!res.ok) {
          msg(authMsg, data.message || '회원가입 실패', true);
          return;
        }
        setLoggedIn(data.accessToken, data.userId, data.email);
        msg(authMsg, '회원가입 및 로그인되었습니다.', false);
      } catch (e) {
        msg(authMsg, '네트워크 오류', true);
      }
    };

    document.getElementById('btnLogout').onclick = () => {
      localStorage.removeItem('gx_access_token');
      localStorage.removeItem('gx_user_id');
      setLoggedIn(null, null);
    };

    document.getElementById('btnGrant').onclick = async () => {
      try {
        const res = await fetch(API_BASE + '/api/demo/grant-membership?count=10&validDays=30', {
          method: 'POST',
          headers: headers()
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.message || '발급 실패');
          return;
        }
        alert('회원권 10회 발급되었습니다. (유효기간 30일)');
      } catch (e) {
        alert('네트워크 오류');
      }
    };

    async function loadSessions() {
      const listEl = document.getElementById('sessionList');
      const msgEl = document.getElementById('sessionsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/sessions/upcoming', { headers: headers() });
        const sessions = await res.json();
        if (!res.ok) throw new Error(sessions.message || '조회 실패');
        listEl.innerHTML = sessions.length === 0
          ? '<li class="session-meta">예약 가능한 세션이 없습니다.</li>'
          : sessions.map(s => {
              const start = s.sessionStartAt ? new Date(s.sessionStartAt).toLocaleString('ko-KR') : '-';
              return '<li><div><span class="session-name">' + (s.sessionName || 'GX') + '</span><div class="session-meta">' + start + ' | ' + (s.reservedCount ?? 0) + '/' + (s.maxCapacity ?? 0) + '</div></div><button data-session-id="' + s.gxSessionId + '" class="btnReserve">예약</button></li>';
            }).join('');
        listEl.querySelectorAll('.btnReserve').forEach(btn => {
          btn.onclick = () => reserve(btn.dataset.sessionId);
        });
        hideMsg(msgEl);
      } catch (e) {
        msg(msgEl, e.message || '세션 목록 조회 실패', true);
      }
    }

    async function reserve(gxSessionId) {
      const msgEl = document.getElementById('sessionsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/reservations', {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify({ gxSessionId })
        });
        const data = await res.json();
        if (!res.ok) {
          msg(msgEl, data.message || '예약 실패', true);
          return;
        }
        msg(msgEl, '예약되었습니다.', false);
        loadSessions();
        loadReservations();
      } catch (e) {
        msg(msgEl, e.message || '예약 실패', true);
      }
    }

    async function loadReservations() {
      const listEl = document.getElementById('reservationList');
      const msgEl = document.getElementById('reservationsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/reservations', { headers: headers() });
        const reservations = await res.json();
        if (!res.ok) throw new Error(reservations.message || '조회 실패');
        const active = reservations.filter(r => r.status === 'RESERVED');
        listEl.innerHTML = active.length === 0
          ? '<li class="session-meta">예약 내역이 없습니다.</li>'
          : active.map(r => '<li><div><span class="session-name">세션 ' + r.gxSessionId + '</span><div class="session-meta">' + r.status + ' | ' + (r.deductCount || 1) + '회 차감</div></div><button data-reservation-id="' + r.reservationId + '" class="btnCancel danger">취소</button></li>').join('');
        listEl.querySelectorAll('.btnCancel').forEach(btn => {
          btn.onclick = () => cancel(btn.dataset.reservationId);
        });
        hideMsg(msgEl);
      } catch (e) {
        msg(msgEl, e.message || '예약 목록 조회 실패', true);
      }
    }

    async function cancel(reservationId) {
      const msgEl = document.getElementById('reservationsMessage');
      try {
        const res = await fetch(API_BASE + '/api/gx/reservations/' + reservationId + '/cancel', {
          method: 'POST',
          headers: headers()
        });
        if (!res.ok) {
          const data = await res.json();
          msg(msgEl, data.message || '취소 실패', true);
          return;
        }
        msg(msgEl, '예약이 취소되었습니다.', false);
        loadSessions();
        loadReservations();
      } catch (e) {
        msg(msgEl, e.message || '취소 실패', true);
      }
    }

    document.getElementById('btnRefreshSessions').onclick = loadSessions;

    if (accessToken) setLoggedIn(accessToken, userId);
  </script>
</body>
</html>
